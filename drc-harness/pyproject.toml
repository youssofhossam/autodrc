[project]
name = "drc-harness"
version = "0.1.0"
description = "A small Tkinter chatbot that lets Gemini call tools on local MCP servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0,<2",
    "jsonschema>=4.20,<5",
    "mcp>=1.0,<2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agentic-chatbot = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
